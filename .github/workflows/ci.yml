name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          SAMPLE: test
          GONE: test
          DATABASE_HOST: localhost
          DATABASE_PORT: "5432"
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        run: |
          python -m pytest

      - name: Build Docker image
        run: |
          docker build -t ai200-app:ci .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          az acr login --name vamsiai200acr

      - name: Tag Docker image
        run: |
          docker tag ai200-app:ci vamsiai200acr.azurecr.io/ai200-app:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push vamsiai200acr.azurecr.io/ai200-app:${{ github.sha }}
      
